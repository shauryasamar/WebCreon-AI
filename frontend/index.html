<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" id="wc-viewport-meta" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <title>WebCreon</title>
    <script>
      (function() {
        try {
          // --- TABLET / IPAD DESKTOP VIEWPORT CONTROLLER (OPTION 1) ---
          function isTabletDevice() {
            var ua = navigator.userAgent || "";
            // Apple iPad (iOS 13+ reports Macintosh with maxTouchPoints > 1)
            var isIPad = /iPad/i.test(ua) || (navigator.maxTouchPoints > 1 && (/Macintosh/i.test(ua) || navigator.platform === "MacIntel"));
            // Android tablet (Android without Mobile in UA)
            var isAndroidTablet = /Android/i.test(ua) && !/Mobile/i.test(ua);
            // Universal touch device with tablet-class screen dimensions (e.g., Chrome DevTools tablet presets, iPad Mini 768px, Air 820px)
            var screenMin = Math.min(window.screen.width || 0, window.screen.height || 0);
            var screenMax = Math.max(window.screen.width || 0, window.screen.height || 0);
            var isTabletScreen = (navigator.maxTouchPoints > 0) && (screenMin >= 600 && screenMin <= 1024) && (screenMax >= 900);

            return isIPad || isAndroidTablet || isTabletScreen;
          }

          function updateTabletViewport() {
            var meta = document.getElementById("wc-viewport-meta") || document.querySelector('meta[name="viewport"]');
            if (!meta) return;

            var pathname = window.location.pathname || "";
            var isStoreRoute = pathname.indexOf("/store/") !== -1 || pathname.indexOf("/site/") !== -1;

            // Customer storefronts always retain standard responsive mobile/tablet viewport
            if (isStoreRoute) {
              meta.setAttribute("content", "width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content");
              return;
            }

            if (isTabletDevice()) {
              var targetWidth = 1200;
              var isLandscape = (typeof window.orientation !== "undefined" && Math.abs(window.orientation) === 90) ||
                                (window.matchMedia && window.matchMedia("(orientation: landscape)").matches);
              var screenMin = Math.min(window.screen.width || 768, window.screen.height || 1024);
              var screenMax = Math.max(window.screen.width || 768, window.screen.height || 1024);
              var currentWidth = isLandscape ? screenMax : screenMin;

              var scale = Math.min(1.0, Number((currentWidth / targetWidth).toFixed(3)));
              meta.setAttribute("content", "width=" + targetWidth + ", initial-scale=" + scale + ", minimum-scale=0.25, maximum-scale=3.0, user-scalable=yes, viewport-fit=cover");
            } else {
              meta.setAttribute("content", "width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content");
            }
          }

          // Run immediately before page rendering
          updateTabletViewport();
          window.__wcUpdateViewport = updateTabletViewport;

          // Re-scale on orientation change or screen resize
          window.addEventListener("orientationchange", function() {
            setTimeout(updateTabletViewport, 120);
          });
          window.addEventListener("resize", function() {
            clearTimeout(window.__wcResizeTimer);
            window.__wcResizeTimer = setTimeout(updateTabletViewport, 150);
          });

          // Intercept SPA navigation so route changes dynamically switch viewports
          var origPush = history.pushState;
          if (origPush) {
            history.pushState = function() {
              origPush.apply(this, arguments);
              updateTabletViewport();
            };
          }
          var origReplace = history.replaceState;
          if (origReplace) {
            history.replaceState = function() {
              origReplace.apply(this, arguments);
              updateTabletViewport();
            };
          }
          window.addEventListener("popstate", updateTabletViewport);

          // --- THEME INITIALIZATION ---
          var pathname = window.location.pathname || "";
          var isStoreRoute = pathname.indexOf("/store/") !== -1 || pathname.indexOf("/site/") !== -1;
          var isDark = false;
          var customBg = null;

          if (isStoreRoute) {
            var pathParts = pathname.split("/");
            var siteKey = pathParts[2] || "";
            if (siteKey) {
              var storeTheme = localStorage.getItem("wc_theme_mode_" + siteKey);
              var storeBg = localStorage.getItem("wc_theme_bg_" + siteKey);
              if (!storeBg || !storeTheme) {
                try {
                  var snapRaw = localStorage.getItem("wc_site_snapshot_" + siteKey);
                  if (snapRaw) {
                    var snap = JSON.parse(snapRaw);
                    var def = snap.site_definition || snap.draft_definition;
                    if (def && def.theme) {
                      if (!storeBg) storeBg = def.theme.primary_bg || def.theme.page_bg;
                      if (!storeTheme) storeTheme = def.theme.mode;
                    }
                  }
                } catch(_) {}
              }
              if (!storeBg || !storeTheme) {
                try {
                  var thRaw = localStorage.getItem("wc_site_theme_" + siteKey);
                  if (thRaw) {
                    var th = JSON.parse(thRaw);
                    if (th && th.theme) {
                      if (!storeBg) storeBg = th.theme.primary_bg || th.theme.page_bg;
                      if (!storeTheme) storeTheme = th.theme.mode;
                    }
                  }
                } catch(_) {}
              }
              if (storeBg) customBg = storeBg;
              if (storeTheme === "dark") isDark = true;
              if (customBg) {
                var c = customBg.toLowerCase().trim();
                if (c === "black" || c === "#000" || c === "#000000" || c === "#0b0f17" || c.indexOf("#0") === 0 || c.indexOf("#1") === 0) {
                  isDark = true;
                }
              }
            }
          }

          if (!isStoreRoute) {
            var mode = localStorage.getItem("app_theme_mode");
            if (!mode) {
              var match = document.cookie.match(/(^|;\s*)app_theme_mode=([^;]+)/);
              if (match) mode = decodeURIComponent(match[2]);
            }
            if (mode === "dark") {
              isDark = true;
            } else if (mode === "system" || (!mode && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
              isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            }
          }

          var bg = customBg || (isDark ? "#121214" : "#f8fafc");
          var text = isDark ? "#f4f4f5" : "#0f172a";
          var scheme = isDark ? "dark" : "light";

          document.documentElement.style.backgroundColor = bg;
          document.documentElement.style.setProperty("--page-bg", bg);
          document.documentElement.style.color = text;
          document.documentElement.style.colorScheme = scheme;
          document.documentElement.setAttribute("data-theme", scheme);
          document.documentElement.setAttribute("data-route-type", isStoreRoute ? "store" : "admin");

          var initStyle = document.createElement("style");
          initStyle.id = "wc-instant-bg-lock";
          initStyle.textContent = "html, body { background-color: " + bg + " !important; color: " + text + " !important; }";
          document.head.appendChild(initStyle);
        } catch(e) {}
      })();
    </script>
    <style id="wc-preboot-style">
      #wc-preboot-root {
        min-height: 100vh;
        width: 100%;
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        background-color: var(--page-bg, #121214);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      @keyframes wcPbPulse {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.8; }
      }
      .wc-pb-shimmer {
        animation: wcPbPulse 1.4s ease-in-out infinite;
        border-radius: 8px;
      }
      [data-theme="dark"] .wc-pb-shimmer {
        background-color: rgba(255, 255, 255, 0.05);
      }
      [data-theme="light"] .wc-pb-shimmer {
        background-color: rgba(15, 23, 42, 0.06);
      }
      [data-theme="dark"] .wc-pb-card {
        background: #18181b;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      [data-theme="light"] .wc-pb-card {
        background: #ffffff;
        border: 1px solid rgba(15, 23, 42, 0.08);
      }
      [data-theme="dark"] .wc-pb-bar {
        background: #18181b;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      [data-theme="light"] .wc-pb-bar {
        background: #ffffff;
        border-bottom: 1px solid rgba(15, 23, 42, 0.08);
      }

      /* Route specific display */
      [data-route-type="admin"] .wc-pb-store-view { display: none !important; }
      [data-route-type="store"] .wc-pb-admin-view { display: none !important; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
